services:
  figurinhas_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: figurinhas_backend
    restart: unless-stopped
    environment:
      FIGURINHAS_STORAGE_ROOT: /app/storage
      FIGURINHAS_DATABASE_URL: sqlite:////app/storage/figurinhas.sqlite3
      FIGURINHAS_ADMIN_TOKEN: ${FIGURINHAS_ADMIN_TOKEN}
      FIGURINHAS_PAGE_RENDER_SCALE: ${FIGURINHAS_PAGE_RENDER_SCALE:-4.0}
      FIGURINHAS_EXPORT_RENDER_SCALE: ${FIGURINHAS_EXPORT_RENDER_SCALE:-6.0}
      FIGURINHAS_PUBLIC_COLLECTION_LIMIT: ${FIGURINHAS_PUBLIC_COLLECTION_LIMIT:-50}
      FIGURINHAS_SERVICE_ENABLED: ${FIGURINHAS_SERVICE_ENABLED:-false}
      FIGURINHAS_PACK_SIZE: ${FIGURINHAS_PACK_SIZE:-7}
      FIGURINHAS_PRINT_PRICE_CENTS: ${FIGURINHAS_PRINT_PRICE_CENTS:-0}
      FIGURINHAS_PACK_PRICE_CENTS: ${FIGURINHAS_PACK_PRICE_CENTS:-0}
      FIGURINHAS_PIX_KEY: ${FIGURINHAS_PIX_KEY:-}
      FIGURINHAS_PIX_HOLDER: ${FIGURINHAS_PIX_HOLDER:-}
      FIGURINHAS_CUSTOM_STICKER_UNLOCK_ENABLED: ${FIGURINHAS_CUSTOM_STICKER_UNLOCK_ENABLED:-false}
      FIGURINHAS_CUSTOM_STICKER_UNLOCK_PRICE_CENTS: ${FIGURINHAS_CUSTOM_STICKER_UNLOCK_PRICE_CENTS:-500}
      FIGURINHAS_CUSTOM_STICKER_UNLOCK_MESSAGE: ${FIGURINHAS_CUSTOM_STICKER_UNLOCK_MESSAGE:-Sua figurinha personalizada e um recurso especial. Voce pode baixar gratis sem ela ou liberar o PDF completo por R$ 5,00.}
      FIGURINHAS_MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      FIGURINHAS_PUBLIC_ACCESS_ENABLED: ${FIGURINHAS_PUBLIC_ACCESS_ENABLED:-false}
      FIGURINHAS_PUBLIC_ACCESS_PRICE_CENTS: ${FIGURINHAS_PUBLIC_ACCESS_PRICE_CENTS:-300}
      FIGURINHAS_PUBLIC_ACCESS_AI_CREDITS: ${FIGURINHAS_PUBLIC_ACCESS_AI_CREDITS:-5}
      FIGURINHAS_PUBLIC_MAGIC_LINK_TTL_MINUTES: ${FIGURINHAS_PUBLIC_MAGIC_LINK_TTL_MINUTES:-30}
      FIGURINHAS_PUBLIC_USER_SESSION_TTL_HOURS: ${FIGURINHAS_PUBLIC_USER_SESSION_TTL_HOURS:-720}
      FIGURINHAS_PUBLIC_MAGIC_LINK_BASE_URL: ${FIGURINHAS_PUBLIC_MAGIC_LINK_BASE_URL:-}
      FIGURINHAS_PUBLIC_AUTH_DEBUG_RETURN_LINK: ${FIGURINHAS_PUBLIC_AUTH_DEBUG_RETURN_LINK:-false}
      FIGURINHAS_PUBLIC_EMAIL_FROM: ${FIGURINHAS_PUBLIC_EMAIL_FROM:-}
      FIGURINHAS_PUBLIC_SMTP_HOST: ${FIGURINHAS_PUBLIC_SMTP_HOST:-}
      FIGURINHAS_PUBLIC_SMTP_PORT: ${FIGURINHAS_PUBLIC_SMTP_PORT:-587}
      FIGURINHAS_PUBLIC_SMTP_USERNAME: ${FIGURINHAS_PUBLIC_SMTP_USERNAME:-}
      FIGURINHAS_PUBLIC_SMTP_PASSWORD: ${FIGURINHAS_PUBLIC_SMTP_PASSWORD:-}
      FIGURINHAS_PUBLIC_SMTP_USE_TLS: ${FIGURINHAS_PUBLIC_SMTP_USE_TLS:-true}
      FIGURINHAS_PUBLIC_SMTP_USE_SSL: ${FIGURINHAS_PUBLIC_SMTP_USE_SSL:-false}
      FIGURINHAS_OPENAI_API_KEY: ${FIGURINHAS_OPENAI_API_KEY:-}
      FIGURINHAS_OPENAI_IMAGE_MODEL: ${FIGURINHAS_OPENAI_IMAGE_MODEL:-gpt-image-2}
      FIGURINHAS_OPENAI_IMAGE_QUALITY: ${FIGURINHAS_OPENAI_IMAGE_QUALITY:-medium}
      FIGURINHAS_PICKUP_NOTE: ${FIGURINHAS_PICKUP_NOTE:-Pagamento via Pix e retirada combinada diretamente comigo.}
    ports:
      - "127.0.0.1:8091:8091"
    volumes:
      - ./storage:/app/storage

  figurinhas_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: /
    container_name: figurinhas_frontend
    restart: unless-stopped
    depends_on:
      - figurinhas_backend
    ports:
      - "127.0.0.1:4310:80"
