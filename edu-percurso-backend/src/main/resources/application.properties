# ── Servidor ──────────────────────────────────────────────────────────────────
server.port=8080

# ── Banco de dados ────────────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/edu_percurso}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:edu_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:edu_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Flyway ────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:edu-percurso-chave-secreta-minimo-32-caracteres-aqui}
jwt.expiracao-ms=${JWT_EXPIRACAO_MS:86400000}

# ── Actuator (healthcheck do Docker) ─────────────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Aplicacao
app.base-url=${APP_BASE_URL:http://localhost}
app.storage.path=${APP_STORAGE_PATH:storage}
app.video.bunny.library-id=${BUNNY_STREAM_LIBRARY_ID:}
app.video.bunny.api-key=${BUNNY_STREAM_API_KEY:}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:30}

# Uploads
spring.servlet.multipart.max-file-size=${APP_MULTIPART_MAX_FILE_SIZE:500MB}
spring.servlet.multipart.max-request-size=${APP_MULTIPART_MAX_REQUEST_SIZE:500MB}

# E-mail
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL_ENABLED:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLED:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Mercado Pago
mercadopago.public-key=${MP_PUBLIC_KEY:}
mercadopago.access-token=${MP_ACCESS_TOKEN:}
mercadopago.webhook-secret=${MP_WEBHOOK_SECRET:}
google.web-client-id=${GOOGLE_WEB_CLIENT_ID:}
