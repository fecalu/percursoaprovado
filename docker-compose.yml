services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: edu_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       edu_percurso
      POSTGRES_USER:     ${DB_USER:-edu_user}
      POSTGRES_PASSWORD: ${DB_PASS:-edu_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-edu_user} -d edu_percurso"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edu_net

  # ── Backend Spring Boot ─────────────────────────────────────────────────────
  backend:
    build:
      context: ./edu-percurso-backend
      dockerfile: ../Dockerfile.backend
    container_name: edu_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL:      jdbc:postgresql://db:5432/edu_percurso
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-edu_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS:-edu_pass}
      JWT_SECRET:                 ${JWT_SECRET:-edu-percurso-chave-secreta-minimo-32-chars}
      JWT_EXPIRACAO_MS:           ${JWT_EXPIRACAO_MS:-86400000}
      APP_BASE_URL:               ${APP_BASE_URL:-http://localhost}
      MAIL_HOST:                  ${MAIL_HOST:-}
      MAIL_PORT:                  ${MAIL_PORT:-465}
      MAIL_USERNAME:              ${MAIL_USERNAME:-}
      MAIL_PASSWORD:              ${MAIL_PASSWORD:-}
      MAIL_FROM:                  ${MAIL_FROM:-}
      MAIL_SSL_ENABLED:           ${MAIL_SSL_ENABLED:-true}
      MAIL_STARTTLS_ENABLED:      ${MAIL_STARTTLS_ENABLED:-false}
      PASSWORD_RESET_EXPIRATION_MINUTES: ${PASSWORD_RESET_EXPIRATION_MINUTES:-30}
      MP_PUBLIC_KEY:              ${MP_PUBLIC_KEY:-}
      MP_ACCESS_TOKEN:            ${MP_ACCESS_TOKEN:-}
      MP_WEBHOOK_SECRET:          ${MP_WEBHOOK_SECRET:-}
      APP_STORAGE_PATH:           /app/storage
    expose:
      - "8080"
    volumes:
      - edu_media:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - edu_net

  # ── Frontend React + Nginx ──────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: edu_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:80"
    networks:
      - edu_net

volumes:
  pgdata:
  edu_media:

networks:
  edu_net:
    driver: bridge
